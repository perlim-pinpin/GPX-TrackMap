PLG_CONTENT_GPXTM_DESCRIPTION="Toont uw GPX-tracks op een interactieve OpenStreetMap-kaart (Leaflet), met grafieken (hoogte, helling, snelheid), foto’s en een downloadknop.<br>In een artikel: <code>{gpxtrackmap}bestand.gpx{/gpxtrackmap}</code>. Alle variabelen staan op het tabblad Variabelen.<br>Plugincode onder de GNU/GPL v2 of later; bibliotheek <a href='https://leafletjs.com' target='_blank' rel='noopener'>Leaflet</a> (BSD-2-licentie). Respecteer de gebruiksvoorwaarden van de achtergrondkaarten (OpenStreetMap, ESRI, IGN…).<br><br>GPX-TrackMap Copyright © 2026 Perlimpin.fr. All rights reserved."
