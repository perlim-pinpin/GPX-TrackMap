GPXTM_WP_ICONS_INTRO="Namen voor de tag <code>&lt;sym&gt;</code> of <code>&lt;type&gt;</code> van het GPX-bestand of de variabele <code>Defaulticon</code>. Ook herkend worden gangbare symbolen (Summit, Campground, Restaurant…) en OpenStreetMap-tags “sleutel=waarde” van de pagina <a href='https://wiki.openstreetmap.org/wiki/DE:Map_Features' target='_blank' rel='noopener'>Map Features</a> (<code>tourism=alpine_hut</code>, <code>amenity=restaurant</code>, <code>natural=peak</code>…). Pictogrammen: SJJB Map Icons, publiek domein."
