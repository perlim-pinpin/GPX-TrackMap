GPXTM_WP_P1="Waypoints zijn de interessante punten in het GPX-bestand (hut, bron, uitzichtpunt…). Elk punt wordt op de kaart getoond met een pictogram dat wordt gekozen uit de tag <code>&lt;sym&gt;</code> of <code>&lt;type&gt;</code> van het GPX-bestand: een pictogramnaam uit de lijst hieronder, een gangbaar symbool of een OpenStreetMap-tag (<code>tourism=viewpoint</code>). Anders wordt het standaardpictogram gebruikt."
GPXTM_WP_P2="Een klik op een waypoint opent een infovenster (naam, opmerking, beschrijving, tijd, coördinaten volgens de opties hieronder)."
GPXTM_WP_EX1="Standaardpictogram: <code>{gpxtrackmap}a.gpx;Defaulticon=tourist_attraction{/gpxtrackmap}</code>"
GPXTM_WP_EX2="De naam en de opmerking van elk waypoint tonen, en de naam bij aanwijzen: <code>{gpxtrackmap}a.gpx;Shwpname=true;Shwpcmt=true;Shwptooltip=true{/gpxtrackmap}</code>"
GPXTM_WP_EX3="Waypoints niet tonen: <code>{gpxtrackmap}a.gpx;Gpxwegpunkte=false{/gpxtrackmap}</code>"
GPXTM_PH_P1="De foto’s staan in de hieronder aangegeven map (binnen <code>/images</code>). Hun naam is de naam van het GPX-bestand gevolgd door een nummer: voor <code>trace.gpx</code> dus <code>trace1.jpg</code>, <code>trace2.jpg</code>… of <code>trace(1).JPG</code>, <code>trace(2).JPG</code>… (hoofdletters en kleine letters tellen)."
GPXTM_PH_P2="Als een foto een titel in de EXIF-metagegevens heeft, wordt die onder de foto getoond. Heeft de foto GPS-coördinaten, dan kan hij ook op de kaart verschijnen."
GPXTM_PH_EX1="Foto’s onder de kaart: <code>{gpxtrackmap}trace.gpx;showimages=1{/gpxtrackmap}</code>"
