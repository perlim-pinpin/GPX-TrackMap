GPXTM_TC_EX2="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;showelevation=1;showslope=1;showspeed=1{/gpxtrackmap}</code>: drie aparte grafieken (hoogte, helling, snelheid) rechts onder elkaar."
GPXTM_TC_EX3="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;showcombined=1{/gpxtrackmap}</code>: één gecombineerde grafiek rechts, met aanvinkbare lijnen."
GPXTM_TC_EX4="<code>{gpxtrackmap}a.gpx,b.gpx;tmpl=tmpl-cote.html;colors=#ff0000,#0000ff;showelevation=1{/gpxtrackmap}</code>: twee tracks, elk een kleur; de grafiek neemt deze kleuren over."
GPXTM_TC_EX5="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;map_height=520px;hpmap_height=120px;showelevation=1;showslope=1{/gpxtrackmap}</code>: kaart van 520 px hoog, grafieken van 120 px hoog."
GPXTM_TD_TITLE="Sjabloon “tmpl-dossier.html”: alle GPX-bestanden van een map"
GPXTM_TD_P1="Een mapnaam (eindigend op <code>/</code>) of <code>*</code> in plaats van een bestandsnaam laadt alle .gpx-bestanden van die map (maximaal 30, alfabetisch). De map is relatief aan het “GPX-pad” van het beheer (standaard <code>images/gpx</code>). Elke track heeft een eigen kleur (variabele <code>Tcols</code>)."
GPXTM_TD_P2="Onder de kaart toont het sjabloon de lijst met tracks: kleur, naam, afstand, hoogteverschil, downloadlink van het bestand en het totaal. Kies het met <code>tmpl=tmpl-dossier.html</code>."
GPXTM_TD_EX1="<code>{gpxtrackmap}randos/;tmpl=tmpl-dossier.html{/gpxtrackmap}</code>: alle .gpx-bestanden van de submap <code>randos</code>."
GPXTM_TD_EX2="<code>{gpxtrackmap}*;tmpl=tmpl-dossier.html{/gpxtrackmap}</code>: alle .gpx-bestanden direct in de GPX-map."
GPXTM_TD_EX3="<code>{gpxtrackmap}2026/;tmpl=tmpl-dossier.html;Tcols=#e6194b,#3cb44b,#4363d8,#f58231;Twidth=3{/gpxtrackmap}</code>: de map <code>2026</code>, met gekozen kleuren en lijndikte."
