GPXTM_PLG_TOESTEMMING="Ik ga akkoord en verbind mij ertoe de licenties van alle gebruikte kaarten en bibliotheken na te leven (Leaflet, OpenStreetMap, ESRI, IGN, OpenTopoMap, BKG…)"
GPXTM_PLG_TOESTEMMING_DESC="• De kaartachtergronden komen van servers van derden (OpenStreetMap, ESRI, IGN, OpenTopoMap, BKG TopPlusOpen, OpenSeaMap, Waymarked Trails…) en de kaart wordt getoond met de bibliotheek Leaflet: elk heeft een eigen licentie en gebruiksvoorwaarden (bronvermelding, niet-commercieel of beperkt gebruik, geen massaal laden).<br>• Ingeschakeld: een venster vraagt de bezoeker uitdrukkelijk om toestemming voordat de kaarten worden geladen en herinnert eraan deze licenties na te leven. Bij weigering wordt de kaart niet geladen en verschijnt een melding.<br>• Uitgeschakeld: de kaart wordt direct geladen. U blijft dan zelf verantwoordelijk voor de naleving van de licenties."

