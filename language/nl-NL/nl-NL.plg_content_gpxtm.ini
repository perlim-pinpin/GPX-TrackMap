GPXTM_TC_P1="De kaart staat links en de gevraagde grafieken (hoogte, helling, snelheid, gecombineerd) staan rechts onder elkaar. Op een klein scherm komen de grafieken onder de kaart. De kaartbreedte is dus automatisch; de hoogte stelt u in met <code>map_height</code>, die van de grafieken met <code>hpmap_height</code>, <code>spmap_height</code>, <code>vpmap_height</code> en <code>cpmap_height</code>."
