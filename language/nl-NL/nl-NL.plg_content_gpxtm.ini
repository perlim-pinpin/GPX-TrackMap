GPXTM_PLG_INSTRUCTIONS="Instructies"

GPXTM_PLG_TAG="{gpxtrackmap}bestandsnaam.gpx{/gpxtrackmap}"
GPXTM_PLG_TAG_DESC="Plaats in een artikel de volgende code: {gpxtrackmap}bestandsnaam.gpx{/gpxtrackmap}. Alle bestanden van een map: {gpxtrackmap}map/{/gpxtrackmap}. Foto’s met dezelfde naam als het gpx-bestand worden onder de kaart getoond: track1.jpg, track2.jpg… of track(1).JPG, track(2).JPG… Als een foto een titel in de EXIF-gegevens heeft, wordt die getoond. De kaart op een punt centreren: {gpxtrackmap}links.gpx;49.953814,6.023185,.7;{/gpxtrackmap} (breedte, lengte, straal in km).<br><br>De variabelen van het tabblad Variabelen kunnen worden gebruikt, gescheiden door een puntkomma.<br>{gpxtrackmap}bestandsnaam.gpx:Satellit;{/gpxtrackmap} toont de satellietweergave.<br>{gpxtrackmap}bestandsnaam.gpx;Shtrziel=true;{/gpxtrackmap} markeert het einde van de track.<br>{gpxtrackmap}bestandsnaam.gpx;map_width=50%;map_height=400px;{/gpxtrackmap} grootte van de kaart (hpmap_width, hpmap_height: grootte van de grafiek).<br>{gpxtrackmap}bestandsnaam.gpx;downloadgpx=0;{/gpxtrackmap} zonder downloadknop.<br>{gpxtrackmap}bestandsnaam.gpx;showelevation=0;{/gpxtrackmap} zonder hoogtegrafiek.<br>{gpxtrackmap}bestandsnaam.gpx;showimages=0;{/gpxtrackmap} zonder foto’s onder de kaart.<br><br>Sjablonen vindt u in de map tmpl van de plugin."

