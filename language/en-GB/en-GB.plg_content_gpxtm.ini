GPXTM_V_TRCOLGRAPH="Also colours the charts with the Trcolmod scale: at each point the curve takes the colour of the chosen value"
GPXTM_V_GINTENSITY="Colour intensity of the charts according to the data: light colour for low values, more and more intense for high ones. true = from the curve itself; h, s or v = from elevation, slope or speed"
GPXTM_V_TRACKWPT="“One marker per track” mode (folder of GPX files): only one marker per file is shown; clicking it displays the track and its charts. Marker choice: start, finish, highest (highest point), first or last (first or last waypoint of the file), name (waypoint whose name contains Trackwptname)"
GPXTM_V_TRACKWPTNAME="With Trackwpt=name: text searched in the waypoint names of each file (case-insensitive); otherwise the first waypoint of the file, then the start"
