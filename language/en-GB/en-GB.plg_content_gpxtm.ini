GPXTM_VARS_P0="Syntax: <code>{gpxtrackmap}file.gpx;Variable1=value;Variable2=value{/gpxtrackmap}</code>. Several files: <code>file1.gpx,file2.gpx</code>."
GPXTM_VARS_P1="The default value is <u>underlined</u>. The administration settings replace them and the variables typed in the article take priority."
GPXTM_VARS_P2="The values “true / false” also accept 1 / 0. Texts can be written with or without quotes. Variable names are not case-sensitive."
GPXTM_VARS_P3="To centre the map on a point: <code>{gpxtrackmap}file.gpx;49.953814,6.023185,.7;{/gpxtrackmap}</code> (latitude, longitude, radius in km)."
GPXTM_VARS_P4="Each <code>{gpxtrackmap}</code> tag has its own settings: colours, displayed graphs (<code>showelevation</code>, <code>showslope</code>, <code>showspeed</code>, <code>showcombined</code>), photos, button, etc. Graph colour different from the track colour: <code>gcolor=#ff8800</code>."
GPXTM_VARS_P5="Two GPX files with chosen colours: in a single tag <code>{gpxtrackmap}a.gpx,b.gpx;colors=#ff0000,#0000ff{/gpxtrackmap}</code>, or in two tags, each with its own colour: <code>{gpxtrackmap}a.gpx;color=#ff0000{/gpxtrackmap}</code> then <code>{gpxtrackmap}b.gpx;color=#0000ff{/gpxtrackmap}</code>. The graphs take the colour of their track."
GPXTM_VARS_P6="The variable <code>Scaling</code> (graph scale) cannot be used in a tag."
GPXTM_VARS_COL1="Variable"
GPXTM_VARS_COL2="Meaning"
GPXTM_VARS_COL3="Values"
GPXTM_VARS_TEXT="text"
GPXTM_VARS_PLUGIN="(plugin)"

GPXTM_TRCOLMOD_SCALE="Colour scale shown at the side of the map: from the minimum (bottom) to the maximum (top)"
GPXTM_TC_TITLE="Template “tmpl-cote.html”: graphs at the side"
GPXTM_TC_P1="The map is on the left and the requested graphs (elevation, slope, speed, combined) are stacked on the right. On a small screen the graphs move below the map. The map width is therefore automatic; set its height with <code>map_height</code> and the graph heights with <code>hpmap_height</code>, <code>spmap_height</code>, <code>vpmap_height</code> and <code>cpmap_height</code>."
GPXTM_TC_P2="Choose it in “Default template” or in the article with <code>tmpl=tmpl-cote.html</code>. Graphs that are not requested leave no gap."
GPXTM_TC_EX1="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html{/gpxtrackmap}</code>: the map and, on the right, the graphs enabled in the administration (elevation by default)."
GPXTM_TC_EX2="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;showelevation=1;showslope=1;showspeed=1{/gpxtrackmap}</code>: three separate graphs (elevation, slope, speed) stacked on the right."
GPXTM_TC_EX3="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;showcombined=1{/gpxtrackmap}</code>: a single combined graph on the right, with its selectable curves."
GPXTM_TC_EX4="<code>{gpxtrackmap}a.gpx,b.gpx;tmpl=tmpl-cote.html;colors=#ff0000,#0000ff;showelevation=1{/gpxtrackmap}</code>: two tracks, one colour each; the graph uses these colours."
GPXTM_TC_EX5="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;map_height=520px;hpmap_height=120px;showelevation=1;showslope=1{/gpxtrackmap}</code>: map 520 px high, graphs 120 px high."
GPXTM_TD_TITLE="Template “tmpl-dossier.html”: all GPX files of a folder"
GPXTM_TD_P1="A folder name (ending with <code>/</code>) or <code>*</code> instead of a file name loads all the .gpx files of that folder (30 at most, in alphabetical order). The folder is relative to the “GPX path” of the administration (default <code>images/gpx</code>). Each track has its own colour (variable <code>Tcols</code>)."
GPXTM_TD_P2="Below the map, the template shows the list of tracks: colour, name, distance, elevation gain, download link of the file, and the total. Choose it with <code>tmpl=tmpl-dossier.html</code>."
GPXTM_TD_EX1="<code>{gpxtrackmap}randos/;tmpl=tmpl-dossier.html{/gpxtrackmap}</code>: all .gpx files of the <code>randos</code> sub-folder."
GPXTM_TD_EX2="<code>{gpxtrackmap}*;tmpl=tmpl-dossier.html{/gpxtrackmap}</code>: all .gpx files directly in the GPX folder."
GPXTM_TD_EX3="<code>{gpxtrackmap}2026/;tmpl=tmpl-dossier.html;Tcols=#e6194b,#3cb44b,#4363d8,#f58231;Twidth=3{/gpxtrackmap}</code>: the <code>2026</code> folder, with chosen colours and line width."
