GPXTM_JS_PICK="Click a marker on the map to show the track and its charts"
GPXTM_TC_EX6="<code>{gpxtrackmap}track.gpx;tmpl=tmpl-cote.html;Trcolmod=s;Trcolgraph=true;showelevation=1;showslope=1{/gpxtrackmap}</code>: the track is coloured by slope, and both charts use the same colours (scale shown on the map)."
GPXTM_TC_EX7="<code>{gpxtrackmap}track.gpx;tmpl=tmpl-cote.html;showelevation=1;Gintensity=true{/gpxtrackmap}</code>: the elevation curve is light for low altitudes and more and more intense for high ones (the base colour is the track colour; set it with <code>colors=#ff0000</code>)."
GPXTM_TC_EX8="<code>{gpxtrackmap}track.gpx;tmpl=tmpl-cote.html;colors=#ff0000;showelevation=1;showslope=1;showspeed=1;Gintensity=s{/gpxtrackmap}</code>: three red charts whose intensity follows the slope (<code>s</code>); <code>h</code> would follow elevation, <code>v</code> speed."
GPXTM_TD_EX4="<code>{gpxtrackmap}hikes/;tmpl=tmpl-dossier.html;Trackwpt=start;showelevation=1{/gpxtrackmap}</code>: a single marker per file, at the start of each track. Clicking the marker (or the table row) shows the track and its elevation chart; the button at the bottom right of the map goes back to all markers."
GPXTM_TD_EX5="<code>{gpxtrackmap}hikes/;tmpl=tmpl-dossier.html;Trackwpt=highest;showelevation=1;showslope=1{/gpxtrackmap}</code>: each track’s marker is its highest point (the summit)."
GPXTM_TD_EX6="<code>{gpxtrackmap}hikes/;tmpl=tmpl-dossier.html;Trackwpt=name;Trackwptname=summit;showelevation=1{/gpxtrackmap}</code>: each track’s marker is the waypoint of its file whose name contains “summit” (with its icon). Without such a waypoint, the first waypoint of the file is used, then the start."
GPXTM_TD_EX7="<code>{gpxtrackmap}hikes/;tmpl=tmpl-dossier.html;Trackwpt=first;Trcolmod=h;Trcolgraph=true;showelevation=1{/gpxtrackmap}</code>: the marker is the first waypoint of each file; the chosen track is coloured by elevation, on the map and on the chart."
