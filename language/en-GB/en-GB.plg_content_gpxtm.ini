GPXTM_PLG_TOESTEMMING="I accept and agree to comply with the licences of all the maps and libraries used (Leaflet, OpenStreetMap, ESRI, IGN, OpenTopoMap, BKG…)"
GPXTM_PLG_TOESTEMMING_DESC="• The map backgrounds come from third-party servers (OpenStreetMap, ESRI, IGN, OpenTopoMap, BKG TopPlusOpen, OpenSeaMap, Waymarked Trails…) and the map is displayed with the Leaflet library: each has its own licence and terms of use (attribution, non-commercial or limited use, no bulk loading).<br>• Enabled: a window asks the visitor for explicit permission before the maps are loaded, reminding them that these licences must be respected. If refused, the map is not loaded and a message says so.<br>• Disabled: the map loads directly. You then remain solely responsible for complying with the licences."

GPXTM_PLG_SHI="Show photos below the map"
GPXTM_PLG_SHI_DESC="Show photos below the map that belong to the gpx file. Photos have the same name as gpx file but ending in (1).JPG,(2).JPG etc (.JPG in CAPITAL LETTERS) or 1.jpg,2.jpg (.jpg in Lower case)! Between the tags showimages=0; of =1;"

