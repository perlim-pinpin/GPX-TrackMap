GPXTM_PLG_INSTRUCTIONS="Instructions"

GPXTM_PLG_TAG="{gpxtrackmap}filename.gpx{/gpxtrackmap}"

GPXTM_PLG_TAG_DESC="In an article, place the following code: {gpxtrackmap}filename.gpx{/gpxtrackmap}. To show all the files of a folder: {gpxtrackmap}folder/{/gpxtrackmap}. Photographs with the same name as the gpx file are shown under the map: track1.jpg, track2.jpg… or track(1).JPG, track(2).JPG… If a photo has a title in its EXIF metadata, it is displayed. To centre the map around a point: {gpxtrackmap}links.gpx;49.953814,6.023185,.7;{/gpxtrackmap} (latitude, longitude, radius in km).<br><br>The variables of the Variables tab can be used, separated by a semicolon.<br>{gpxtrackmap}filename.gpx:Satellit;{/gpxtrackmap} shows the satellite view.<br>{gpxtrackmap}filename.gpx;Shtrziel=true;{/gpxtrackmap} marks the end of the track.<br>{gpxtrackmap}filename.gpx;map_width=50%;map_height=400px;{/gpxtrackmap} size of the map (hpmap_width, hpmap_height: size of the graph).<br>{gpxtrackmap}filename.gpx;downloadgpx=0;{/gpxtrackmap} no download button.<br>{gpxtrackmap}filename.gpx;showelevation=0;{/gpxtrackmap} no elevation graph.<br>{gpxtrackmap}filename.gpx;showimages=0;{/gpxtrackmap} no photos under the map.<br><br>Templates are available in the tmpl folder of the plugin."

