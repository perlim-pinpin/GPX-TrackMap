PLG_CONTENT_GPXTM_DESCRIPTION="Displays your GPX tracks on an interactive OpenStreetMap map (Leaflet), with graphs (elevation, slope, speed), photos and a download button.<br>In an article: <code>{gpxtrackmap}file.gpx{/gpxtrackmap}</code>. All variables are in the Variables tab.<br>Plugin code under the GNU/GPL v2 or later; <a href='https://leafletjs.com' target='_blank' rel='noopener'>Leaflet</a> library (BSD-2 licence). Please respect the terms of use of the base maps (OpenStreetMap, ESRI, IGN…).<br><br>GPX-TrackMap Copyright © 2026 Perlimpin.fr. All rights reserved."
