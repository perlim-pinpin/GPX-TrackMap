GPXTM_WP_P1="Les waypoints sont les points d’intérêt enregistrés dans le fichier GPX (refuge, source, point de vue…). Chacun s’affiche sur la carte avec une icône choisie d’après la balise <code>&lt;sym&gt;</code> ou <code>&lt;type&gt;</code> du fichier GPX : nom d’icône de la liste ci-dessous, symbole courant ou balise OpenStreetMap (<code>tourism=viewpoint</code>). Sinon, l’icône par défaut est utilisée."
GPXTM_WP_P2="Un clic sur un waypoint ouvre une fenêtre d’information (nom, commentaire, description, heure, coordonnées selon les options ci-dessous)."
GPXTM_WP_EX1="Icône par défaut : <code>{gpxtrackmap}a.gpx;Defaulticon=tourist_attraction{/gpxtrackmap}</code>"
GPXTM_WP_EX2="Afficher le nom et le commentaire de chaque waypoint, et son nom au survol : <code>{gpxtrackmap}a.gpx;Shwpname=true;Shwpcmt=true;Shwptooltip=true{/gpxtrackmap}</code>"
GPXTM_WP_EX3="Ne pas afficher les waypoints : <code>{gpxtrackmap}a.gpx;Gpxwegpunkte=false{/gpxtrackmap}</code>"
GPXTM_PH_P1="Les photos se placent dans le dossier indiqué ci-dessous (dans <code>/images</code>). Leur nom reprend celui du fichier GPX suivi d’un numéro : pour <code>trace.gpx</code>, <code>trace1.jpg</code>, <code>trace2.jpg</code>… ou <code>trace(1).JPG</code>, <code>trace(2).JPG</code>… (les majuscules et minuscules comptent)."
GPXTM_PH_P2="Si une photo contient un titre dans ses métadonnées EXIF, il s’affiche sous la photo. Si elle contient des coordonnées GPS, elle peut aussi apparaître sur la carte."
GPXTM_PH_EX1="Photos sous la carte : <code>{gpxtrackmap}trace.gpx;showimages=1{/gpxtrackmap}</code>"
GPXTM_PH_EX2="Photos géolocalisées sur la carte seulement : <code>{gpxtrackmap}trace.gpx;showimages=0;geoimg=1{/gpxtrackmap}</code>"
GPXTM_PH_EX3="Aucune photo : <code>{gpxtrackmap}trace.gpx;showimages=0;geoimg=0{/gpxtrackmap}</code>"
