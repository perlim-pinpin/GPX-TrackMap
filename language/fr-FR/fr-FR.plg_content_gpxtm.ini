GPXTM_PLG_TOESTEMMING="J’accepte et je m’engage à respecter les licences de toutes les cartes et bibliothèques utilisées (Leaflet, OpenStreetMap, ESRI, IGN, OpenTopoMap, BKG…)"
GPXTM_PLG_TOESTEMMING_DESC="• Les fonds de carte viennent de serveurs tiers (OpenStreetMap, ESRI, IGN, OpenTopoMap, BKG TopPlusOpen, OpenSeaMap, Waymarked Trails…) et la carte est affichée avec la bibliothèque Leaflet : chacun a sa licence et ses conditions d’utilisation (mentions d’attribution, usage non commercial ou limité, pas de chargement massif).<br>• Activée : une fenêtre demande au visiteur son autorisation explicite avant de charger les cartes, en rappelant qu’il doit respecter ces licences. S’il refuse, la carte n’est pas chargée et un message l’indique.<br>• Désactivée : la carte se charge directement. Vous restez alors seul responsable du respect des licences."

GPXTM_PLG_SHI="Afficher les photos sous la carte"
GPXTM_PLG_SHI_DESC="Afficher sous la carte les photos correspondant au fichier gpx. Les photos portent le même nom que le fichier gpx, mais se terminent par (1).JPG, (2).JPG, etc.JPG en LETTRES MAJUSCULES ! showimages=0; of=1;"

