GPXTM_PLG_GEOIMG_DESC="Les images contenant des informations GPS seront affichées sur la carte. Les photos portent le même nom que le fichier gpx, mais se terminent par (1).JPG, (2).JPG, etc. (JPG en LETTRES MAJUSCULES) ou 1.jpg,2.jpg (jpg en lettres minuscules). Entre les balises geoimg=0 ; ou 1 ;"

