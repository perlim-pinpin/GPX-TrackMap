GPXTM_PLG_INSTRUCTIONS="Exemples"

GPXTM_PLG_TAG="{gpxtrackmap}NomDuFichier.gpx{/gpxtrackmap}"

GPXTM_PLG_TAG_DESC="Dans un article, placez le code suivant : {gpxtrackmap}NomDuFichier.gpx{/gpxtrackmap}. Pour afficher tous les fichiers d’un dossier : {gpxtrackmap}dossier/{/gpxtrackmap}. Les photos portant le même nom que le fichier GPX s’affichent sous la carte : trace1.jpg, trace2.jpg… ou trace(1).JPG, trace(2).JPG… Si la photo contient un titre dans ses métadonnées EXIF, il est affiché. Pour centrer la carte sur un point : {gpxtrackmap}links.gpx;49.953814,6.023185,.7;{/gpxtrackmap} (latitude, longitude, rayon en km).<br><br>Les variables de l’onglet Variables peuvent être utilisées, séparées par un point-virgule.<br>{gpxtrackmap}NomDuFichier.gpx:Satellit;{/gpxtrackmap} affiche la vue satellite.<br>{gpxtrackmap}NomDuFichier.gpx;Shtrziel=true;{/gpxtrackmap} marque l’arrivée de la trace.<br>{gpxtrackmap}NomDuFichier.gpx;map_width=50%;map_height=400px;{/gpxtrackmap} taille de la carte (hpmap_width, hpmap_height : taille du graphique).<br>{gpxtrackmap}NomDuFichier.gpx;downloadgpx=0;{/gpxtrackmap} sans bouton de téléchargement.<br>{gpxtrackmap}NomDuFichier.gpx;showelevation=0;{/gpxtrackmap} sans graphique de dénivelé.<br>{gpxtrackmap}NomDuFichier.gpx;showimages=0;{/gpxtrackmap} sans photos sous la carte.<br><br>Des modèles sont disponibles dans le dossier tmpl du plugin."

