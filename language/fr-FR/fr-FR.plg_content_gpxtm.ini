GPXTM_TC_TITLE="Modèle « tmpl-cote.html » : graphiques sur le côté"
GPXTM_TC_P1="La carte est à gauche et les graphiques demandés (dénivelé, pente, vitesse, combiné) sont empilés à droite. Sur un petit écran, les graphiques passent sous la carte. La largeur de la carte est donc automatique ; sa hauteur se règle avec <code>map_height</code>, celle des graphiques avec <code>hpmap_height</code>, <code>spmap_height</code>, <code>vpmap_height</code> et <code>cpmap_height</code>."
GPXTM_TC_P2="Choisissez-le dans « Template par défaut » ou dans l’article avec <code>tmpl=tmpl-cote.html</code>. Les graphiques non demandés ne laissent aucun vide."
GPXTM_TC_EX1="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html{/gpxtrackmap}</code> : la carte et, à droite, les graphiques activés dans l’administration (par défaut le dénivelé)."
GPXTM_TC_EX2="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;showelevation=1;showslope=1;showspeed=1{/gpxtrackmap}</code> : trois graphiques séparés (dénivelé, pente, vitesse) empilés à droite."
GPXTM_TC_EX3="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;showcombined=1{/gpxtrackmap}</code> : un seul graphique combiné à droite, avec ses courbes à cocher."
GPXTM_TC_EX4="<code>{gpxtrackmap}a.gpx,b.gpx;tmpl=tmpl-cote.html;colors=#ff0000,#0000ff;showelevation=1{/gpxtrackmap}</code> : deux traces, une couleur chacune ; le graphique reprend ces couleurs."
GPXTM_TC_EX5="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;map_height=520px;hpmap_height=120px;showelevation=1;showslope=1{/gpxtrackmap}</code> : carte haute de 520 px, graphiques de 120 px de haut."
GPXTM_TD_TITLE="Modèle « tmpl-dossier.html » : tous les GPX d’un dossier"
GPXTM_TD_P1="Le nom d’un dossier (finissant par <code>/</code>) ou <code>*</code> à la place du nom de fichier charge tous les fichiers .gpx de ce dossier (30 au maximum, par ordre alphabétique). Le dossier est relatif au « Chemin des GPX » de l’administration (par défaut <code>images/gpx</code>). Chaque trace a sa couleur (variable <code>Tcols</code>)."
GPXTM_TD_P2="Sous la carte, le modèle affiche la liste des traces : couleur, nom, distance, dénivelé, lien de téléchargement du fichier, et le total. Choisissez-le avec <code>tmpl=tmpl-dossier.html</code>."
GPXTM_TD_EX1="<code>{gpxtrackmap}randos/;tmpl=tmpl-dossier.html{/gpxtrackmap}</code> : tous les .gpx du sous-dossier <code>randos</code>."
GPXTM_TD_EX2="<code>{gpxtrackmap}*;tmpl=tmpl-dossier.html{/gpxtrackmap}</code> : tous les .gpx directement dans le dossier des GPX."
GPXTM_TD_EX3="<code>{gpxtrackmap}2026/;tmpl=tmpl-dossier.html;Tcols=#e6194b,#3cb44b,#4363d8,#f58231;Twidth=3{/gpxtrackmap}</code> : le dossier <code>2026</code>, avec des couleurs et une épaisseur de trait choisies."
