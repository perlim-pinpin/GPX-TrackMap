GPXTM_JS_CONSENT_Q="Cette page utilise des cartes (Leaflet, OpenStreetMap, ESRI, IGN, OpenTopoMap, BKG…) fournies par des serveurs tiers : vos données de visite leur sont transmises. En cliquant sur OK, vous acceptez ce chargement et vous vous engagez à respecter les licences et conditions d'utilisation de ces cartes."
GPXTM_JS_CONSENT_NO="L'autorisation a été refusée : les cartes ne sont pas chargées. Vous pouvez changer d'avis en rechargeant la page."
GPXTM_JS_NODATA="Aucune trace n'a pu être lue dans le(s) fichier(s) GPX."
GPXTM_JS_NOMAP="Sans fond de carte"
GPXTM_JS_WAYPOINTS="Waypoints"
GPXTM_SEP_WPICON="Icône par défaut"
GPXTM_SEP_WPICONS="Liste des icônes"
GPXTM_PLG_DEFAULTICON="Icône par défaut"
GPXTM_PLG_DEFAULTICON_DESC="Icône des waypoints dont le fichier GPX ne précise aucune icône, ou une icône inconnue. Vide : un repère rouge. Dans l’article : Defaulticon=nom."
GPXTM_ICON_DEFAULT="Repère rouge"
GPXTM_WP_ICONS_INTRO="Dénomination à utiliser dans la balise <code>&lt;sym&gt;</code> ou <code>&lt;type&gt;</code> du fichier GPX, ou dans la variable <code>Defaulticon</code>. Sont aussi reconnus les symboles courants (Summit, Campground, Restaurant…) et les balises OpenStreetMap « clé=valeur » de la page <a href='https://wiki.openstreetmap.org/wiki/DE:Map_Features' target='_blank' rel='noopener'>Map Features</a> (<code>tourism=alpine_hut</code>, <code>amenity=restaurant</code>, <code>natural=peak</code>…). Icônes : SJJB Map Icons, domaine public."
GPXTM_PLG_MAPLANG="Langue des textes de la carte et des graphiques"
GPXTM_PLG_MAPLANG_DESC="Langue utilisée pour les légendes, infobulles, boutons, graphiques et avertissement. « Automatique » suit la langue du site ; choisissez Français si votre site est configuré dans une autre langue."
GPXTM_PLG_MAPLANG_AUTO="Automatique (langue du site)"
GPXTM_JS_ZOOMIN="Zoom avant"
GPXTM_JS_ZOOMOUT="Zoom arrière"
GPXTM_V_TRCOLGRAPH="Colore aussi les graphiques avec l’échelle de Trcolmod : la courbe prend, en chaque point, la couleur de la valeur choisie"
GPXTM_V_GINTENSITY="Intensité de la couleur des graphiques selon les données : couleur claire pour les valeurs faibles, de plus en plus intense pour les fortes. true = selon la courbe elle-même ; h, s ou v = selon l’altitude, la pente ou la vitesse"
GPXTM_V_TRACKWPT="Mode « un repère par trace » (dossier de GPX) : seul un repère par fichier est affiché ; un clic sur le repère affiche la trace et ses graphiques. Choix du repère : start (départ), finish (arrivée), highest (point culminant), first ou last (premier ou dernier waypoint du fichier), name (waypoint dont le nom contient Trackwptname)"
GPXTM_V_TRACKWPTNAME="Avec Trackwpt=name : texte cherché dans le nom des waypoints de chaque fichier (sans tenir compte des majuscules) ; à défaut, le premier waypoint du fichier, puis le départ"
GPXTM_JS_SHOWALL="Tous les parcours"
GPXTM_JS_PICK="Cliquez sur un repère de la carte pour afficher la trace et ses graphiques"
GPXTM_TC_EX6="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;Trcolmod=s;Trcolgraph=true;showelevation=1;showslope=1{/gpxtrackmap}</code> : la trace est colorée selon la pente, et les deux graphiques prennent les mêmes couleurs (échelle affichée sur la carte)."
GPXTM_TC_EX7="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;showelevation=1;Gintensity=true{/gpxtrackmap}</code> : la courbe d’altitude est claire pour les altitudes basses et de plus en plus intense pour les hautes (la couleur de base est celle de la trace ; choisissez-la avec <code>colors=#ff0000</code>)."
GPXTM_TC_EX8="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;colors=#ff0000;showelevation=1;showslope=1;showspeed=1;Gintensity=s{/gpxtrackmap}</code> : trois graphiques rouges dont l’intensité suit la pente (<code>s</code>) ; <code>h</code> la ferait suivre l’altitude, <code>v</code> la vitesse."
GPXTM_TD_EX4="<code>{gpxtrackmap}randos/;tmpl=tmpl-dossier.html;Trackwpt=start;showelevation=1{/gpxtrackmap}</code> : un seul repère par fichier, au départ de chaque trace. Un clic sur le repère (ou sur la ligne du tableau) affiche la trace et son graphique de dénivelé ; le bouton en bas à droite de la carte ramène à tous les repères."
GPXTM_TD_EX5="<code>{gpxtrackmap}randos/;tmpl=tmpl-dossier.html;Trackwpt=highest;showelevation=1;showslope=1{/gpxtrackmap}</code> : le repère de chaque trace est son point le plus haut (le sommet)."
GPXTM_TD_EX6="<code>{gpxtrackmap}randos/;tmpl=tmpl-dossier.html;Trackwpt=name;Trackwptname=sommet;showelevation=1{/gpxtrackmap}</code> : le repère de chaque trace est le waypoint de son fichier dont le nom contient « sommet » (avec son icône). Sans waypoint de ce nom, le premier waypoint du fichier est utilisé, puis le départ."
GPXTM_TD_EX7="<code>{gpxtrackmap}randos/;tmpl=tmpl-dossier.html;Trackwpt=first;Trcolmod=h;Trcolgraph=true;showelevation=1{/gpxtrackmap}</code> : le repère est le premier waypoint de chaque fichier ; la trace choisie est colorée selon l’altitude, sur la carte et sur le graphique."
