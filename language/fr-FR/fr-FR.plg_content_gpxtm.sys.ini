PLG_CONTENT_GPXTM_DESCRIPTION="Affiche vos traces GPX sur une carte OpenStreetMap interactive (Leaflet), avec graphiques (dénivelé, pente, vitesse), photos et bouton de téléchargement.<br>Dans un article : <code>{gpxtrackmap}fichier.gpx{/gpxtrackmap}</code>. Toutes les variables sont dans l’onglet Variables.<br>Code du plugin sous licence GNU/GPL v2 ou ultérieure ; bibliothèque <a href='https://leafletjs.com' target='_blank' rel='noopener'>Leaflet</a> (licence BSD-2). Respectez les conditions d’utilisation des fonds de carte (OpenStreetMap, ESRI, IGN…).<br><br>GPX-TrackMap Copyright © 2026 Perlimpin.fr. All rights reserved."
