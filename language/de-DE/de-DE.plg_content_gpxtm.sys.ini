PLG_CONTENT_GPXTM_DESCRIPTION="Zeigt Ihre GPX-Tracks auf einer interaktiven OpenStreetMap-Karte (Leaflet), mit Diagrammen (Höhe, Steigung, Geschwindigkeit), Fotos und einer Download-Schaltfläche.<br>In einem Artikel: <code>{gpxtrackmap}datei.gpx{/gpxtrackmap}</code>. Alle Variablen stehen im Reiter Variablen.<br>Plugin-Code unter der GNU/GPL v2 oder neuer; Bibliothek <a href='https://leafletjs.com' target='_blank' rel='noopener'>Leaflet</a> (BSD-2-Lizenz). Beachten Sie die Nutzungsbedingungen der Hintergrundkarten (OpenStreetMap, ESRI, IGN…).<br><br>GPX-TrackMap Copyright © 2026 Perlimpin.fr. All rights reserved."
