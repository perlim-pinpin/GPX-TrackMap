GPXTM_WP_P1="Wegpunkte sind die in der GPX-Datei gespeicherten interessanten Punkte (Hütte, Quelle, Aussichtspunkt…). Jeder wird auf der Karte mit einem Symbol angezeigt, das nach dem Tag <code>&lt;sym&gt;</code> oder <code>&lt;type&gt;</code> der GPX-Datei gewählt wird: ein Symbolname der Liste unten, ein gängiges Symbol oder ein OpenStreetMap-Tag (<code>tourism=viewpoint</code>). Sonst wird das Standardsymbol verwendet."
GPXTM_WP_P2="Ein Klick auf einen Wegpunkt öffnet ein Infofenster (Name, Kommentar, Beschreibung, Zeit, Koordinaten je nach den Optionen unten)."
GPXTM_WP_EX1="Standardsymbol: <code>{gpxtrackmap}a.gpx;Defaulticon=tourist_attraction{/gpxtrackmap}</code>"
GPXTM_WP_EX2="Name und Kommentar jedes Wegpunkts anzeigen, und den Namen beim Überfahren: <code>{gpxtrackmap}a.gpx;Shwpname=true;Shwpcmt=true;Shwptooltip=true{/gpxtrackmap}</code>"
GPXTM_WP_EX3="Wegpunkte nicht anzeigen: <code>{gpxtrackmap}a.gpx;Gpxwegpunkte=false{/gpxtrackmap}</code>"
GPXTM_PH_P1="Die Fotos liegen im unten angegebenen Ordner (innerhalb von <code>/images</code>). Ihr Name entspricht dem Namen der GPX-Datei mit einer Nummer: für <code>trace.gpx</code> also <code>trace1.jpg</code>, <code>trace2.jpg</code>… oder <code>trace(1).JPG</code>, <code>trace(2).JPG</code>… (Groß- und Kleinschreibung zählt)."
GPXTM_PH_P2="Enthält ein Foto einen Titel in den EXIF-Metadaten, wird er unter dem Foto angezeigt. Enthält es GPS-Koordinaten, kann es auch auf der Karte erscheinen."
GPXTM_PH_EX1="Fotos unter der Karte: <code>{gpxtrackmap}trace.gpx;showimages=1{/gpxtrackmap}</code>"
GPXTM_PH_EX2="Nur georeferenzierte Fotos auf der Karte: <code>{gpxtrackmap}trace.gpx;showimages=0;geoimg=1{/gpxtrackmap}</code>"
GPXTM_PH_EX3="Keine Fotos: <code>{gpxtrackmap}trace.gpx;showimages=0;geoimg=0{/gpxtrackmap}</code>"
