GPXTM_PLG_INSTRUCTIONS="Anweisung"

GPXTM_PLG_TAG="{gpxtrackmap}Dateiname.gpx{/gpxtrackmap}"

GPXTM_PLG_TAG_DESC="Fügen Sie in einem Artikel folgenden Code ein: {gpxtrackmap}Dateiname.gpx{/gpxtrackmap}. Alle Dateien eines Ordners: {gpxtrackmap}ordner/{/gpxtrackmap}. Fotos mit dem Namen der GPX-Datei erscheinen unter der Karte: track1.jpg, track2.jpg… oder track(1).JPG, track(2).JPG… Enthält ein Foto einen Titel in den EXIF-Metadaten, wird er angezeigt. Karte auf einen Punkt zentrieren: {gpxtrackmap}links.gpx;49.953814,6.023185,.7;{/gpxtrackmap} (Breite, Länge, Radius in km).<br><br>Die Variablen des Reiters Variablen können durch Semikolon getrennt verwendet werden.<br>{gpxtrackmap}Dateiname.gpx:Satellit;{/gpxtrackmap} zeigt die Satellitenansicht.<br>{gpxtrackmap}Dateiname.gpx;Shtrziel=true;{/gpxtrackmap} markiert das Ende des Tracks.<br>{gpxtrackmap}Dateiname.gpx;map_width=50%;map_height=400px;{/gpxtrackmap} Größe der Karte (hpmap_width, hpmap_height: Größe des Diagramms).<br>{gpxtrackmap}Dateiname.gpx;downloadgpx=0;{/gpxtrackmap} ohne Download-Schaltfläche.<br>{gpxtrackmap}Dateiname.gpx;showelevation=0;{/gpxtrackmap} ohne Höhendiagramm.<br>{gpxtrackmap}Dateiname.gpx;showimages=0;{/gpxtrackmap} ohne Fotos unter der Karte.<br><br>Vorlagen finden Sie im Ordner tmpl des Plugins."

