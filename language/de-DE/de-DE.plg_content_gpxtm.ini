GPXTM_PLG_FINISH="Endpunkt anzeigen"
GPXTM_PLG_FINISH_DESC="Das Ende des GPX-Tracks mit einem Ikoon anzeigen. Zwischen den Tags Shtrziel=false; oder =true;"

GPXTM_PLG_TOESTEMMING="Ich akzeptiere und verpflichte mich, die Lizenzen aller verwendeten Karten und Bibliotheken einzuhalten (Leaflet, OpenStreetMap, ESRI, IGN, OpenTopoMap, BKG…)"
GPXTM_PLG_TOESTEMMING_DESC="• Die Kartenhintergründe stammen von Servern Dritter (OpenStreetMap, ESRI, IGN, OpenTopoMap, BKG TopPlusOpen, OpenSeaMap, Waymarked Trails…) und die Karte wird mit der Bibliothek Leaflet angezeigt: Jede hat eigene Lizenz- und Nutzungsbedingungen (Quellenangabe, nicht kommerzielle oder begrenzte Nutzung, kein Massenabruf).<br>• Aktiviert: Ein Fenster fragt den Besucher vor dem Laden der Karten ausdrücklich um Erlaubnis und erinnert daran, diese Lizenzen einzuhalten. Bei Ablehnung wird die Karte nicht geladen und eine Meldung weist darauf hin.<br>• Deaktiviert: Die Karte wird direkt geladen. Sie bleiben dann allein für die Einhaltung der Lizenzen verantwortlich."

GPXTM_PLG_SHI="Fotos unter der Karte anzeigen"
GPXTM_PLG_SHI_DESC="Fotos unterhalb der Karte anzeigen, die zur gpx-Datei gehören. Fotos haben den gleichen Namen wie die GPX-Datei, enden jedoch auf (1).JPG,(2).JPG. (JPG in GROSSBUCHSTABEN) oder 1.jpg,2.jpg (jpg in Kleinbuchstaben). Zwischen den Tags showimages=0; oder =1;"

GPXTM_PLG_LEGEND="Legende"
GPXTM_PLG_LEGEND_DESC="Legende linksoben der Karte anzeigen. Zwischen den Tags Legende=false; oder true;"

GPXTM_PLG_FULLSCREEN="Vollbildsymbol"
GPXTM_PLG_FULLSCREEN_DESC="Blendet oben rechts in der Karte ein Vollbildsymbol ein, mit dem sie auf volle Größe vergrößert werden kann. Zwischen den Tags Fullscreenbutton=false; oder true;"

GPXTM_PLG_GEOIMG="Fotos mit GPS-Informationen auf der Karte anzeigen"
GPXTM_PLG_GEOIMG_DESC="Bilder mit GPS-Info werden auf der Karte angezeigt. Fotos haben den gleichen Namen wie die GPX-Datei, enden jedoch auf (1).JPG,(2).JPG. (JPG in GROSSBUCHSTABEN) oder 1.jpg,2.jpg (jpg in Kleinbuchstaben)! Zwischen den Tags geoimg=0; or 1;"

