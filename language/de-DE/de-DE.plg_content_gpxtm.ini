GPXTM_TC_TITLE="Vorlage „tmpl-cote.html“: Diagramme an der Seite"
GPXTM_TC_P1="Die Karte steht links, die gewünschten Diagramme (Höhe, Steigung, Geschwindigkeit, kombiniert) sind rechts untereinander angeordnet. Auf kleinen Bildschirmen wandern die Diagramme unter die Karte. Die Kartenbreite ist daher automatisch; die Höhe stellen Sie mit <code>map_height</code> ein, die der Diagramme mit <code>hpmap_height</code>, <code>spmap_height</code>, <code>vpmap_height</code> und <code>cpmap_height</code>."
GPXTM_TC_P2="Wählen Sie sie unter „Standardvorlage“ oder im Artikel mit <code>tmpl=tmpl-cote.html</code>. Nicht gewünschte Diagramme lassen keine Lücke."
GPXTM_TC_EX1="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html{/gpxtrackmap}</code>: die Karte und rechts die in der Verwaltung aktivierten Diagramme (standardmäßig die Höhe)."
GPXTM_TC_EX2="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;showelevation=1;showslope=1;showspeed=1{/gpxtrackmap}</code>: drei getrennte Diagramme (Höhe, Steigung, Geschwindigkeit) rechts untereinander."
GPXTM_TC_EX3="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;showcombined=1{/gpxtrackmap}</code>: ein einziges kombiniertes Diagramm rechts mit wählbaren Kurven."
GPXTM_TC_EX4="<code>{gpxtrackmap}a.gpx,b.gpx;tmpl=tmpl-cote.html;colors=#ff0000,#0000ff;showelevation=1{/gpxtrackmap}</code>: zwei Tracks mit je einer Farbe; das Diagramm übernimmt diese Farben."
GPXTM_TC_EX5="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;map_height=520px;hpmap_height=120px;showelevation=1;showslope=1{/gpxtrackmap}</code>: Karte 520 px hoch, Diagramme 120 px hoch."
GPXTM_TD_TITLE="Vorlage „tmpl-dossier.html“: alle GPX-Dateien eines Ordners"
GPXTM_TD_P1="Ein Ordnername (mit <code>/</code> am Ende) oder <code>*</code> statt eines Dateinamens lädt alle .gpx-Dateien dieses Ordners (höchstens 30, alphabetisch). Der Ordner ist relativ zum „GPX-Pfad“ der Verwaltung (Standard <code>images/gpx</code>). Jeder Track hat seine eigene Farbe (Variable <code>Tcols</code>)."
GPXTM_TD_P2="Unter der Karte zeigt die Vorlage die Liste der Tracks: Farbe, Name, Strecke, Höhenmeter, Download-Link der Datei und die Summe. Wählen Sie sie mit <code>tmpl=tmpl-dossier.html</code>."
GPXTM_TD_EX1="<code>{gpxtrackmap}randos/;tmpl=tmpl-dossier.html{/gpxtrackmap}</code>: alle .gpx-Dateien des Unterordners <code>randos</code>."
GPXTM_TD_EX2="<code>{gpxtrackmap}*;tmpl=tmpl-dossier.html{/gpxtrackmap}</code>: alle .gpx-Dateien direkt im GPX-Ordner."
GPXTM_TD_EX3="<code>{gpxtrackmap}2026/;tmpl=tmpl-dossier.html;Tcols=#e6194b,#3cb44b,#4363d8,#f58231;Twidth=3{/gpxtrackmap}</code>: der Ordner <code>2026</code> mit gewählten Farben und Linienstärke."
