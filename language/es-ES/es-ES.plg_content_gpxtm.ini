GPXTM_WP_P1="Los waypoints son los puntos de interés guardados en el archivo GPX (refugio, fuente, mirador…). Cada uno se muestra en el mapa con un icono elegido según la etiqueta <code>&lt;sym&gt;</code> o <code>&lt;type&gt;</code> del archivo GPX: un nombre de icono de la lista de abajo, un símbolo habitual o una etiqueta de OpenStreetMap (<code>tourism=viewpoint</code>). Si no, se usa el icono por defecto."
GPXTM_WP_P2="Un clic en un waypoint abre una ventana de información (nombre, comentario, descripción, hora, coordenadas según las opciones de abajo)."
GPXTM_WP_EX1="Icono por defecto: <code>{gpxtrackmap}a.gpx;Defaulticon=tourist_attraction{/gpxtrackmap}</code>"
GPXTM_WP_EX2="Mostrar el nombre y el comentario de cada waypoint, y su nombre al pasar el cursor: <code>{gpxtrackmap}a.gpx;Shwpname=true;Shwpcmt=true;Shwptooltip=true{/gpxtrackmap}</code>"
GPXTM_WP_EX3="No mostrar los waypoints: <code>{gpxtrackmap}a.gpx;Gpxwegpunkte=false{/gpxtrackmap}</code>"
GPXTM_PH_P1="Las fotos se colocan en la carpeta indicada a continuación (dentro de <code>/images</code>). Su nombre es el del archivo GPX seguido de un número: para <code>traza.gpx</code>, <code>traza1.jpg</code>, <code>traza2.jpg</code>… o <code>traza(1).JPG</code>, <code>traza(2).JPG</code>… (se distingue entre mayúsculas y minúsculas)."
GPXTM_PH_P2="Si una foto contiene un título en sus metadatos EXIF, se muestra bajo la foto. Si contiene coordenadas GPS, también puede aparecer en el mapa."
GPXTM_PH_EX1="Fotos bajo el mapa: <code>{gpxtrackmap}traza.gpx;showimages=1{/gpxtrackmap}</code>"
GPXTM_PH_EX2="Solo fotos georreferenciadas en el mapa: <code>{gpxtrackmap}traza.gpx;showimages=0;geoimg=1{/gpxtrackmap}</code>"
GPXTM_PH_EX3="Ninguna foto: <code>{gpxtrackmap}traza.gpx;showimages=0;geoimg=0{/gpxtrackmap}</code>"
