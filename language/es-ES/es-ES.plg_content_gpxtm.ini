GPXTM_WP_ICONS_INTRO="Nombres que se usan en la etiqueta <code>&lt;sym&gt;</code> o <code>&lt;type&gt;</code> del archivo GPX, o en la variable <code>Defaulticon</code>. También se reconocen símbolos habituales (Summit, Campground, Restaurant…) y etiquetas «clave=valor» de OpenStreetMap de la página <a href='https://wiki.openstreetmap.org/wiki/DE:Map_Features' target='_blank' rel='noopener'>Map Features</a> (<code>tourism=alpine_hut</code>, <code>amenity=restaurant</code>, <code>natural=peak</code>…). Iconos: SJJB Map Icons, dominio público."
