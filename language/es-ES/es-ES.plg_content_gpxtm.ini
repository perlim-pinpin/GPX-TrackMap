GPXTM_PLG_TOESTEMMING="Acepto y me comprometo a respetar las licencias de todos los mapas y bibliotecas utilizados (Leaflet, OpenStreetMap, ESRI, IGN, OpenTopoMap, BKG…)"
GPXTM_PLG_TOESTEMMING_DESC="• Los fondos de mapa proceden de servidores de terceros (OpenStreetMap, ESRI, IGN, OpenTopoMap, BKG TopPlusOpen, OpenSeaMap, Waymarked Trails…) y el mapa se muestra con la biblioteca Leaflet: cada uno tiene su licencia y sus condiciones de uso (atribución, uso no comercial o limitado, sin cargas masivas).<br>• Activada: una ventana pide al visitante su autorización explícita antes de cargar los mapas, recordándole que debe respetar estas licencias. Si la rechaza, el mapa no se carga y un mensaje lo indica.<br>• Desactivada: el mapa se carga directamente. Usted sigue siendo el único responsable del cumplimiento de las licencias."
