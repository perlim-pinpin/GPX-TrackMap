GPXTM_TC_TITLE="Plantilla «tmpl-cote.html»: gráficos al lado"
GPXTM_TC_P1="El mapa está a la izquierda y los gráficos solicitados (altitud, pendiente, velocidad, combinado) se apilan a la derecha. En una pantalla pequeña, los gráficos pasan debajo del mapa. El ancho del mapa es, por tanto, automático; su altura se ajusta con <code>map_height</code> y la de los gráficos con <code>hpmap_height</code>, <code>spmap_height</code>, <code>vpmap_height</code> y <code>cpmap_height</code>."
GPXTM_TC_P2="Elíjala en «Plantilla por defecto» o en el artículo con <code>tmpl=tmpl-cote.html</code>. Los gráficos no solicitados no dejan ningún hueco."
GPXTM_TC_EX1="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html{/gpxtrackmap}</code>: el mapa y, a la derecha, los gráficos activados en la administración (por defecto la altitud)."
GPXTM_TC_EX2="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;showelevation=1;showslope=1;showspeed=1{/gpxtrackmap}</code>: tres gráficos separados (altitud, pendiente, velocidad) apilados a la derecha."
GPXTM_TC_EX3="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;showcombined=1{/gpxtrackmap}</code>: un único gráfico combinado a la derecha, con sus curvas seleccionables."
GPXTM_TC_EX4="<code>{gpxtrackmap}a.gpx,b.gpx;tmpl=tmpl-cote.html;colors=#ff0000,#0000ff;showelevation=1{/gpxtrackmap}</code>: dos trazas, un color cada una; el gráfico usa esos colores."
GPXTM_TC_EX5="<code>{gpxtrackmap}trace.gpx;tmpl=tmpl-cote.html;map_height=520px;hpmap_height=120px;showelevation=1;showslope=1{/gpxtrackmap}</code>: mapa de 520 px de alto, gráficos de 120 px de alto."
GPXTM_TD_TITLE="Plantilla «tmpl-dossier.html»: todos los GPX de una carpeta"
GPXTM_TD_P1="Un nombre de carpeta (terminado en <code>/</code>) o <code>*</code> en lugar del nombre de archivo carga todos los archivos .gpx de esa carpeta (30 como máximo, por orden alfabético). La carpeta es relativa a la «Ruta de los GPX» de la administración (por defecto <code>images/gpx</code>). Cada traza tiene su color (variable <code>Tcols</code>)."
GPXTM_TD_P2="Debajo del mapa, la plantilla muestra la lista de trazas: color, nombre, distancia, desnivel, enlace de descarga del archivo y el total. Elíjala con <code>tmpl=tmpl-dossier.html</code>."
GPXTM_TD_EX1="<code>{gpxtrackmap}randos/;tmpl=tmpl-dossier.html{/gpxtrackmap}</code>: todos los .gpx de la subcarpeta <code>randos</code>."
GPXTM_TD_EX2="<code>{gpxtrackmap}*;tmpl=tmpl-dossier.html{/gpxtrackmap}</code>: todos los .gpx directamente en la carpeta de GPX."
GPXTM_TD_EX3="<code>{gpxtrackmap}2026/;tmpl=tmpl-dossier.html;Tcols=#e6194b,#3cb44b,#4363d8,#f58231;Twidth=3{/gpxtrackmap}</code>: la carpeta <code>2026</code>, con colores y grosor de línea elegidos."
GPXTM_PLG_TAG_DESC="En un artículo, coloque el siguiente código: {gpxtrackmap}NombreDelArchivo.gpx{/gpxtrackmap}. Para todos los archivos de una carpeta: {gpxtrackmap}carpeta/{/gpxtrackmap}. Las fotos con el mismo nombre que el archivo GPX se muestran bajo el mapa: traza1.jpg, traza2.jpg… o traza(1).JPG, traza(2).JPG… Si una foto tiene un título en los metadatos EXIF, se muestra. Para centrar el mapa en un punto: {gpxtrackmap}links.gpx;49.953814,6.023185,.7;{/gpxtrackmap} (latitud, longitud, radio en km).<br><br>Pueden usarse las variables de la pestaña Variables, separadas por punto y coma.<br>{gpxtrackmap}NombreDelArchivo.gpx:Satellit;{/gpxtrackmap} muestra la vista satélite.<br>{gpxtrackmap}NombreDelArchivo.gpx;Shtrziel=true;{/gpxtrackmap} marca el final de la traza.<br>{gpxtrackmap}NombreDelArchivo.gpx;map_width=50%;map_height=400px;{/gpxtrackmap} tamaño del mapa (hpmap_width, hpmap_height: tamaño del gráfico).<br>{gpxtrackmap}NombreDelArchivo.gpx;downloadgpx=0;{/gpxtrackmap} sin botón de descarga.<br>{gpxtrackmap}NombreDelArchivo.gpx;showelevation=0;{/gpxtrackmap} sin gráfico de desnivel.<br>{gpxtrackmap}NombreDelArchivo.gpx;showimages=0;{/gpxtrackmap} sin fotos bajo el mapa.<br><br>Hay plantillas en la carpeta tmpl del plugin."
