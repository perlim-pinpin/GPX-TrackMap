PLG_CONTENT_GPXTM_DESCRIPTION="Muestra sus trazas GPX en un mapa interactivo de OpenStreetMap (Leaflet), con gráficos (desnivel, pendiente, velocidad), fotos y un botón de descarga.<br>En un artículo: <code>{gpxtrackmap}archivo.gpx{/gpxtrackmap}</code>. Todas las variables están en la pestaña Variables.<br>Código del plugin bajo GNU/GPL v2 o posterior; biblioteca <a href='https://leafletjs.com' target='_blank' rel='noopener'>Leaflet</a> (licencia BSD-2). Respete las condiciones de uso de los mapas de fondo (OpenStreetMap, ESRI, IGN…).<br><br>GPX-TrackMap Copyright © 2026 Perlimpin.fr. All rights reserved."
